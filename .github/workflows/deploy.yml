name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Unzip ready files
        run: |
          unzip dist/public/phlogiston.zip -d public_html
          cp dist/public/phlogiston.zip public_html/phlogiston.zip
          cp -r dist/public/installed public_html/installed
          for manifest in public_html/manifest.webmanifest public_html/manifest.json; do
            jq '.start_url = "./installed/"' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public_html'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
